<script type="module">
// Canadian Aquoral carton v3 (2026-11-16): the client's print file "Aquoral Box Canada 3" (PO 201888, 16 pt paper box,
// 53 x 29 x 100 mm). Each face is cropped straight from the dieline PDF rendered at 600 dpi (carton/*.png, made by
// carton-panels.py), so every word on the 3D box is the client's own artwork, not a redraw.
import * as THREE from 'three';

import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const BOX = { w: 53, h: 100, d: 29 }; // mm, from the dieline ("53x29x100")

  const c = document.createElement('canvas'); const swap = rot % 2 === 1;
  c.width = swap ? img.height : img.width; c.height = swap ? img.width : img.height;

  r.setSize(w, h); const s = new THREE.Scene(); s.environment = env; s.add(obj);
  const b = new THREE.Box3().setFromObject(obj), c = b.getCenter(new THREE.Vector3()), z = b.getSize(new THREE.Vector3());
  const cam = new THREE.PerspectiveCamera(22, w / h, 0.001, 10); const d = Math.max(z.y, z.x * h / w * 1.2) * 1.18 / 2 / Math.tan(THREE.MathUtils.degToRad(11));
  const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);

  'aquoral-carton-ca3.glb': btoa(new Uint8Array(glb).reduce((s, b) => s + String.fromCharCode(b), '')),
  'renders/carton-ca3-front.png': shot(box, 0), 'renders/carton-ca3-back.png': shot(box, 180), 'renders/carton-ca3-side-fr.png': shot(box, 90), 'renders/carton-ca3-side-en.png': shot(box, -90),
  'renders/carton-ca3-34.png': shot(box, 35, 12), 'renders/carton-ca3-back-34.png': shot(box, 215, 12), 'renders/carton-ca3-top.png': shot(box, 20, 70), 'renders/carton-ca3-bottom.png': shot(box, 20, -70),
  'renders/hero-pack-ca3.png': shot(pack, -10, 10, 1400, 1200),
};
window.DONE = true;
</script></body></html>
