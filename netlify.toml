# Aquoral Canada website: static site built by site/build.py (Python standard library only).
[build]
  command = "python3 site/build.py"
  publish = "site/dist"

[build.environment]
  # build.py uses f-string syntax that needs Python 3.12 or newer
  PYTHON_VERSION = "3.13"

# Preview deploys: keep search engines out until launch (product claims and checkout are placeholders).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# No long-lived cache on /assets: CSS/JS names are not hashed, so a one-hour cache paired new pages with
# stale stylesheets on phones (2026-11-11). build.py also appends ?v=<hash> to every CSS/JS reference.
[[headers]]
  for = "/assets/models/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
